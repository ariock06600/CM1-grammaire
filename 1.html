<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mission : Stop au Harcèlement !</title>
    <style>
        /* Thème Sombre & Style adapté aux enfants */
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #f0f0f0;
            --primary: #8a2be2;
            --primary-hover: #6a1b9a;
            --correct: #4caf50;
            --wrong: #f44336;
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            color: #ffb300;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .medals-container {
            background: var(--card-bg);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 1.2rem;
            border: 2px solid #ffb300;
            display: inline-block;
        }

        .card {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 600px;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.6);
            text-align: center;
            min-height: 250px;
        }

        .question-text {
            font-size: 1.3rem;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .sentence {
            color: #4fc3f7;
            font-style: italic;
            font-weight: bold;
            font-size: 1.5rem;
            display: block;
            margin: 15px 0;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        button {
            font-family: inherit;
            font-size: 1.1rem;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-option {
            background-color: #2c2c2c;
            color: white;
            border: 2px solid var(--primary);
        }

        .btn-option:hover {
            background-color: var(--primary);
        }

        .btn-option:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .btn-nav {
            background-color: var(--primary);
            color: white;
            font-weight: bold;
            margin: 5px;
            width: 120px;
        }

        .btn-nav:hover {
            background-color: var(--primary-hover);
        }

        .btn-nav:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        .navigation {
            margin-top: 25px;
            display: flex;
            justify-content: space-between;
        }

        #feedback {
            margin-top: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            min-height: 30px;
        }

        .progress {
            margin-top: 15px;
            color: #aaa;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>🛡️ Mission : Stop au Harcèlement !</h1>
        <div class="medals-container">
            Médailles gagnées : <span id="medal-display">Aucune pour l'instant 🤔</span>
        </div>
    </header>

    <div class="card">
        <div id="exercise-container">
            <!-- Le contenu de l'exercice sera injecté ici par JavaScript -->
        </div>
        <div id="feedback"></div>
        
        <div class="navigation">
            <button id="btn-prev" class="btn-nav" onclick="changeExercise(-1)">◀ Précédent</button>
            <button id="btn-next" class="btn-nav" onclick="changeExercise(1)">Suivant ▶</button>
        </div>
        <div class="progress" id="progress-text">Exercice 1 / 4</div>
    </div>

    <script>
        // Base de données des exercices (alliant le harcèlement et les types de phrases)
        const exercises = [
            {
                question: "Lis cette phrase pour aider un camarade. De quel type de phrase s'agit-il ?",
                sentence: "« Ne reste pas tout seul dans ton coin. »",
                options: ["Phrase déclarative", "Phrase interrogative", "Phrase impérative"],
                correctAnswer: 2,
                explanation: "C'est un conseil ou un ordre pour protéger quelqu'un. C'est une phrase impérative !"
            },
            {
                question: "Tu vois quelqu'un pleurer. Tu lui demandes :",
                sentence: "« Est-ce que quelqu'un t'a fait du mal ? »",
                options: ["Phrase déclarative", "Phrase interrogative", "Phrase impérative"],
                correctAnswer: 1,
                explanation: "Tu poses une question (point d'interrogation). C'est une phrase interrogative !"
            },
            {
                question: "Tu expliques la règle à la récréation :",
                sentence: "« Les moqueries quotidiennes sont punies par la loi. »",
                options: ["Phrase déclarative", "Phrase interrogative", "Phrase impérative"],
                correctAnswer: 0,
                explanation: "Tu donnes une information (elle se termine par un point). C'est une phrase déclarative !"
            },
            {
                question: "Que dois-tu dire si tu es témoin de harcèlement ?",
                sentence: "« Allez prévenir un adulte immédiatement ! »",
                options: ["Phrase déclarative", "Phrase interrogative", "Phrase impérative"],
                correctAnswer: 2,
                explanation: "Tu donnes un ordre important pour agir vite. C'est une phrase impérative !"
            }
        ];

        let currentExIndex = 0;
        let score = 0;
        let answeredQuestions = new Array(exercises.length).fill(false);

        const container = document.getElementById('exercise-container');
        const feedback = document.getElementById('feedback');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const progressText = document.getElementById('progress-text');
        const medalDisplay = document.getElementById('medal-display');

        function loadExercise() {
            const ex = exercises[currentExIndex];
            
            let html = `
                <div class="question-text">${ex.question}</div>
                <span class="sentence">${ex.sentence}</span>
                <div class="options">
            `;

            ex.options.forEach((opt, index) => {
                // Si la question a déjà été répondue, on désactive les boutons
                const disabled = answeredQuestions[currentExIndex] ? "disabled" : "";
                html += `<button class="btn-option" onclick="checkAnswer(${index})" ${disabled}>${opt}</button>`;
            });

            html += `</div>`;
            container.innerHTML = html;

            // Mise à jour de l'interface
            feedback.innerHTML = "";
            progressText.innerText = `Exercice ${currentExIndex + 1} / ${exercises.length}`;
            btnPrev.disabled = currentExIndex === 0;
            btnNext.disabled = currentExIndex === exercises.length - 1;
        }

        function checkAnswer(selectedIndex) {
            if (answeredQuestions[currentExIndex]) return; // Empêche de répondre plusieurs fois
            
            const ex = exercises[currentExIndex];
            const buttons = document.querySelectorAll('.btn-option');
            answeredQuestions[currentExIndex] = true;

            // Désactiver tous les boutons après le clic
            buttons.forEach(btn => btn.disabled = true);

            if (selectedIndex === ex.correctAnswer) {
                feedback.innerHTML = `✅ Bravo ! ${ex.explanation}`;
                feedback.style.color = "var(--correct)";
                buttons[selectedIndex].style.backgroundColor = "var(--correct)";
                score++;
            } else {
                feedback.innerHTML = `❌ Oups ! ${ex.explanation}`;
                feedback.style.color = "var(--wrong)";
                buttons[selectedIndex].style.backgroundColor = "var(--wrong)";
                buttons[ex.correctAnswer].style.backgroundColor = "var(--correct)"; // Montre la bonne réponse
            }

            updateMedals();
        }

        function updateMedals() {
            let medals = "";
            if (score >= 1) medals = "🥉 Bronze";
            if (score >= 2) medals = "🥉 Bronze, 🥈 Argent";
            if (score >= 3) medals = "🥉 Bronze, 🥈 Argent, 🥇 Or";
            if (score === 4) medals = "🏆 Champion de la Bienveillance ! (Score Parfait)";

            if (score > 0) {
                medalDisplay.innerHTML = medals;
            }
        }

        function changeExercise(step) {
            currentExIndex += step;
            loadExercise();
        }

        // Charger le premier exercice au démarrage
        loadExercise();
    </script>
</body>
</html>
